apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mask-and-maker-root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: mask-and-maker
  source:
    repoURL: https://github.com/Kushan20070126/gitops-mask_and_maker.git
    targetRevision: HEAD
    path: argocd/applications
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
