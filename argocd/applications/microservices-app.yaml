apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: maskandmaker-platform
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: mask-and-maker
  source:
    repoURL: https://github.com/Kushan20070126/gitops-mask_and_maker.git
    targetRevision: HEAD
    path: charts/maskandmaker-platform
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: maskandmaker
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
