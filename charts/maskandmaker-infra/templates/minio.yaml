{{- if .Values.minio.enabled }}
{{- if .Values.minio.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-pvc
  namespace: {{ .Values.namespace }}
  labels:
    app: minio
    app.kubernetes.io/part-of: maskandmaker
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ .Values.storageClassName }}
  resources:
    requests:
      storage: {{ .Values.minio.persistence.size }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: {{ .Values.namespace }}
  labels:
    app: minio
    app.kubernetes.io/part-of: maskandmaker
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
        app.kubernetes.io/part-of: maskandmaker
    spec:
      securityContext:
        fsGroup: 0
      containers:
        - name: minio
          image: {{ .Values.minio.image }}
          imagePullPolicy: IfNotPresent
          args:
            - server
            - /data
            - --console-address
            - ":{{ .Values.minio.consolePort }}"
          envFrom:
            - secretRef:
                name: mm-common-secret
          ports:
            - containerPort: {{ .Values.minio.apiPort }}
              name: api
            - containerPort: {{ .Values.minio.consolePort }}
              name: console
          resources:
            {{- toYaml .Values.minio.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /minio/health/live
              port: {{ .Values.minio.apiPort }}
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: {{ .Values.minio.apiPort }}
            initialDelaySeconds: 20
            periodSeconds: 20
          {{- if .Values.minio.persistence.enabled }}
          volumeMounts:
            - name: minio-storage
              mountPath: /data
          {{- end }}
      {{- if .Values.minio.persistence.enabled }}
      volumes:
        - name: minio-storage
          persistentVolumeClaim:
            claimName: minio-pvc
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: {{ .Values.namespace }}
  labels:
    app: minio
    app.kubernetes.io/part-of: maskandmaker
spec:
  type: ClusterIP
  selector:
    app: minio
  ports:
    - name: api
      port: {{ .Values.minio.apiPort }}
      targetPort: {{ .Values.minio.apiPort }}
    - name: console
      port: {{ .Values.minio.consolePort }}
      targetPort: {{ .Values.minio.consolePort }}
{{- end }}
